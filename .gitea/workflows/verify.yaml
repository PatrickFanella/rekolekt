name: Main verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ml-runtime.txt
            constraints.txt
      - name: Install FFmpeg shared libraries for the speech runtime
        shell: bash
        run: |
          set -euo pipefail
          privilege=()
          if [[ "$(id -u)" != 0 ]]; then
            privilege=(sudo)
          fi
          "${privilege[@]}" apt-get update -q
          "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Create isolated Python verification environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .verify-venv
          "${{ steps.python.outputs.python-path }}" -m venv .verify-venv
          .verify-venv/bin/python -m pip install --upgrade pip
          .verify-venv/bin/python -m pip install setuptools==84.1.0
          # Keep the full ML test surface, using the same pinned CPU wheels as Dockerfile.cpu.
          mapfile -t ml_wheels < <(grep -E '^(torch|torchaudio|torchcodec)==' requirements-ml-runtime.txt)
          [[ "${#ml_wheels[@]}" == 3 ]]
          .verify-venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu "${ml_wheels[@]}"
          .verify-venv/bin/python -m pip install -c constraints.txt -c requirements-ml-runtime.txt -r requirements.txt -r requirements-dev.txt
          .verify-venv/bin/python -m pip check
          .verify-venv/bin/python scripts/verify_ml_runtime.py
          .verify-venv/bin/python -c "import torch; assert '+cpu' in torch.__version__, torch.__version__"
      - name: Run canonical verification
        run: |
          set -euo pipefail
          gateway="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .Gateway}}{{end}}' "$(hostname)" | while IFS= read -r candidate; do
            [[ -n "$candidate" ]] && { printf '%s\n' "$candidate"; break; }
          done)"
          [[ "$gateway" =~ ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]
          PYTHON_BIN="$PWD/.verify-venv/bin/python" TEST_SERVICE_HOST="$gateway" make verify
  deploy-landing:
    name: Build landing image and deploy Almaz
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.sha }}
    - name: Build the verified source revision
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
        image="fleet-deploy/rekolekt/rekolekt-landing:$DEPLOY_REVISION"
        docker build --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
          --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/rekolekt" \
          -t "$image" landing
    - name: Deploy the built image and verify public HTML
      if: >-
        github.server_url == 'https://git.subcult.tv' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      shell: bash
      env:
        DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
        test -n "$DEPLOY_KEY"
        test -n "$DEPLOY_KNOWN_HOSTS"
        umask 077
        deploy_dir=$(mktemp -d)
        trap 'rm -rf "$deploy_dir"' EXIT
        printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
        unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
        ssh_args=(-i "$deploy_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
          -o ConnectTimeout=15 onnwee@10.0.0.200)
        ssh "${ssh_args[@]}" status
        image="fleet-deploy/rekolekt/rekolekt-landing:$DEPLOY_REVISION"
        # The forced receiver accepts a full hexadecimal revision; expand it here.
        # shellcheck disable=SC2029
        docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION rekolekt-landing"
        # shellcheck disable=SC2029
        ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
        expected=$(docker run --rm --entrypoint /bin/cat "$image" /srv/index.html | sha256sum | cut -d' ' -f1)
        curl --fail --silent --show-error --retry 4 --retry-all-errors \
          --max-time 30 https://rekolekt.subcult.tv/ > "$deploy_dir/live.html"
        actual=$(sha256sum "$deploy_dir/live.html" | cut -d' ' -f1)
        test "$actual" = "$expected"
        printf 'Live HTML matches the image built from %s\n' "$DEPLOY_REVISION"
